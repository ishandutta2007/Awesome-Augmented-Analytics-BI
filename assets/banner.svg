<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 50px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #cbd5e1;
        letter-spacing: 0px;
      }
      .tag {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Animated SVG Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveBar {
        0%, 100% { transform: scaleY(0.8); }
        50% { transform: scaleY(1.15); }
      }

      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pulsing-bg {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .animated-stream {
        stroke-dasharray: 12 8;
        animation: dashMove 20s linear infinite;
      }
      .bar-1 { transform-origin: bottom; animation: waveBar 3s ease-in-out infinite; }
      .bar-2 { transform-origin: bottom; animation: waveBar 3.8s ease-in-out infinite 0.4s; }
      .bar-3 { transform-origin: bottom; animation: waveBar 2.5s ease-in-out infinite 0.8s; }
      .bar-4 { transform-origin: bottom; animation: waveBar 3.2s ease-in-out infinite 0.2s; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Glowing Orbs -->
  <circle cx="150" cy="100" r="180" fill="#6366f1" opacity="0.25" filter="url(#blurGlow)" class="pulsing-bg" />
  <circle cx="1050" cy="300" r="220" fill="#a855f7" opacity="0.2" filter="url(#blurGlow)" class="pulsing-bg" />
  <circle cx="600" cy="200" r="150" fill="#ec4899" opacity="0.15" filter="url(#blurGlow)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" />
    <path d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400" />
  </g>

  <!-- Decorative Dynamic Background Graphs & Flows (Strictly Background / Right Side) -->
  <g transform="translate(780, 80)" filter="url(#dropShadow)" class="floating-card">
    <!-- Semi-transparent glass card for visual graphics -->
    <rect width="360" height="240" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />
    
    <!-- Header of mini card -->
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#f59e0b" />
    <circle cx="66" cy="30" r="6" fill="#10b981" />
    <text x="90" y="34" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">AI Insights &amp; Analytics Hub</text>

    <!-- Animated Data Chart Bars -->
    <g transform="translate(40, 190)">
      <rect class="bar-1" x="0" y="-80" width="24" height="80" rx="4" fill="#6366f1" />
      <rect class="bar-2" x="40" y="-120" width="24" height="120" rx="4" fill="#a855f7" />
      <rect class="bar-3" x="80" y="-60" width="24" height="60" rx="4" fill="#38bdf8" />
      <rect class="bar-4" x="120" y="-140" width="24" height="140" rx="4" fill="#ec4899" />
    </g>

    <!-- Trend Line / Sparkline overlay -->
    <path d="M 40 130 Q 80 70, 120 120 T 200 50 T 280 80 T 320 40" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- AI Pulsing Nodes -->
    <circle cx="200" cy="50" r="6" fill="#38bdf8" />
    <circle cx="200" cy="50" r="12" fill="none" stroke="#38bdf8" stroke-width="2" class="pulsing-bg" />
    <circle cx="320" cy="40" r="6" fill="#ec4899" />
  </g>

  <!-- Flow connecting lines -->
  <path class="animated-stream" d="M 100 340 C 300 380, 500 320, 750 350" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" />

  <!-- Main Foreground Content (Left Aligned & Crystal Clear) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" class="tag">ENTERPRISE &amp; OPEN-SOURCE BI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title" filter="url(#dropShadow)">
      Awesome Augmented
    </text>
    <text x="0" y="220" class="title" fill="url(#accentGrad)" filter="url(#dropShadow)">
      Analytics &amp; BI 📊 🧠
    </text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">
      Curated AI Copilots, Conversational BI, NLQ &amp; Semantic Modeling Platforms
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="19" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">🤖 AI Copilots</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="19" font-family="sans-serif" font-size="13" fill="#a855f7" font-weight="600">💬 NLQ &amp; Chat BI</text>

      <!-- Pill 3 -->
      <rect x="299" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="314" y="19" font-family="sans-serif" font-size="13" fill="#10b981" font-weight="600">🔓 Self-Hosted OSS</text>
    </g>
  </g>
</svg>
