<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><filter id="blurGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><filter id="dropShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.4}50%{opacity:.8}}@keyframes dashMove{0%{stroke-dashoffset:100}}@keyframes waveBar{0%{transform:scaleY(.8)}50%{transform:scaleY(1.15)}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:50px;font-weight:900;fill:#fff;letter-spacing:-1px}.subtitle{font-size:20px;font-weight:500;fill:#cbd5e1;letter-spacing:0}.tag{font-size:13px;font-weight:700;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.floating-card{animation:floatSlow 6s ease-in-out infinite}.pulsing-bg{animation:pulseGlow 4s ease-in-out infinite}.animated-stream{stroke-dasharray:12 8;animation:dashMove 20s linear infinite}.bar-1{animation:waveBar 3s ease-in-out infinite}.bar-1,.bar-2,.bar-3,.bar-4{transform-origin:bottom}.bar-2{animation:waveBar 3.8s ease-in-out infinite .4s}.bar-3{animation:waveBar 2.5s ease-in-out infinite .8s}.bar-4{animation:waveBar 3.2s ease-in-out infinite .2s}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="100" r="180" fill="#6366f1" class="pulsing-bg" filter="url(#blurGlow)" opacity=".25"/><circle cx="1050" cy="300" r="220" fill="#a855f7" class="pulsing-bg" filter="url(#blurGlow)" opacity=".2"/><circle cx="600" cy="200" r="150" fill="#ec4899" filter="url(#blurGlow)" opacity=".15"/><g stroke="#fff" stroke-width="1" opacity=".08"><path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/><path d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400"/></g><g class="floating-card" filter="url(#dropShadow)" transform="translate(780, 80)"><rect width="360" height="240" fill="#1e293b" fill-opacity=".6" stroke="#475569" stroke-width="1.5" rx="16"/><circle cx="30" cy="30" r="6" fill="#ef4444"/><circle cx="48" cy="30" r="6" fill="#f59e0b"/><circle cx="66" cy="30" r="6" fill="#10b981"/><text x="90" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AI Insights &amp; Analytics Hub</text><g transform="translate(40, 190)"><rect width="24" height="80" x="0" y="-80" fill="#6366f1" class="bar-1" rx="4"/><rect width="24" height="120" x="40" y="-120" fill="#a855f7" class="bar-2" rx="4"/><rect width="24" height="60" x="80" y="-60" fill="#38bdf8" class="bar-3" rx="4"/><rect width="24" height="140" x="120" y="-140" fill="#ec4899" class="bar-4" rx="4"/></g><path fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-width="4" d="M 40 130 Q 80 70, 120 120 T 200 50 T 280 80 T 320 40"/><circle cx="200" cy="50" r="6" fill="#38bdf8"/><circle cx="200" cy="50" r="12" fill="none" stroke="#38bdf8" stroke-width="2" class="pulsing-bg"/><circle cx="320" cy="40" r="6" fill="#ec4899"/></g><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M 100 340 C 300 380, 500 320, 750 350" class="animated-stream" opacity=".6"/><g><g transform="translate(80, 0) translate(0, 75)"><rect width="320" height="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"/><text x="32" y="21" class="tag">ENTERPRISE &amp; OPEN-SOURCE BI</text></g><text x="0" y="160" class="title" filter="url(#dropShadow)" transform="translate(80, 0)">Awesome Augmented</text><text x="0" y="220" fill="url(#accentGrad)" class="title" filter="url(#dropShadow)" transform="translate(80, 0)">Analytics &amp; BI 📊 🧠</text><text x="0" y="270" class="subtitle" transform="translate(80, 0)">Curated AI Copilots, Conversational BI, NLQ &amp; Semantic Modeling Platforms</text><g transform="translate(80, 0) translate(0, 310)"><rect width="130" height="30" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="15" y="19" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">🤖 AI Copilots</text><rect width="145" height="30" x="142" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="157" y="19" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="600">💬 NLQ &amp; Chat BI</text><rect width="165" height="30" x="299" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="314" y="19" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="600">🔓 Self-Hosted OSS</text></g></g></svg>